
<!-- MY NOTES SECTION -->
<section class="panel" id="notes">

    <div class="panel-header">
        <div>
            <h2>📝 My Notes</h2>
            <p>Create and organize your study notes</p>
        </div>
        <span>📚</span>
    </div>

    <form id="noteForm">

        <div style="margin-bottom: 15px;">
            <label for="noteTitle">Note Title</label>
            <input
                type="text"
                id="noteTitle"
                placeholder="e.g. DBMS Normalization"
                required
                style="width:100%; padding:12px; margin-top:8px;"
            >
        </div>

        <div style="margin-bottom: 15px;">
            <label for="noteSubject">Select Subject</label>
            <select
                id="noteSubject"
                required
                style="width:100%; padding:12px; margin-top:8px;"
            >
                <option value="">Choose subject</option>
                <option value="DSA">DSA / C++</option>
                <option value="DBMS">DBMS</option>
                <option value="JavaScript">JavaScript</option>
                <option value="MERN">MERN Stack</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="noteContent">Write Your Notes</label>
            <textarea
                id="noteContent"
                rows="6"
                placeholder="Write your study notes here..."
                required
                style="width:100%; padding:12px; margin-top:8px; resize:vertical;"
            ></textarea>
        </div>

        <button type="submit" id="saveNoteBtn">
            + Save Note
        </button>

    </form>

    <hr style="margin:25px 0;">

    <div class="panel-header">
        <div>
            <h2>Saved Notes</h2>
            <p>Your notes will appear here</p>
        </div>
    </div>

    <input
        type="search"
        id="notesSearch"
        placeholder="Search your notes..."
        style="width:100%; padding:12px; margin-bottom:15px;"
    >

    <div id="notesList">
        <p id="notesEmptyState">
            📚 No notes yet. Create your first note!
        </p>
    </div>

</section>
